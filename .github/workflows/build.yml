name: Build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Raspberry Pi 2B / ARMv7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # The backend has no external dependencies so there is nothing
          # worth caching; an empty module cache also triggers a warning
          # in the post-job cache step.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build for Raspberry Pi 2B (linux/arm v7)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -o brightlight .

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: brightlight-linux-armv7
          path: backend/brightlight
          retention-days: 30

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 30
